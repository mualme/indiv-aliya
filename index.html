
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aliya's individual JavaScript work</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f1eb;
        }
        #myCard {
            padding: 30px;
            background-color: #eee5d8;
            border: 2px solid #c5b49c;
            border-radius: 10px;
            margin-top: 15px;
        }
        .highlight {        
            background-color: #d8c4a8;
            border-color: #8b7355;
        }
        #myCard:focus {
            outline: 3px solid #8b7355;
        }
    </style>
    <script src="script.js" defer></script>
</head>
<body>

    <h1>Counter</h1>

    <p>Counter: <span id="counter">0</span></p>

    <button id="increaseBtn">Increase</button>
    <button id="decreaseBtn">Decrease</button>
    <button id="resetBtn">Reset</button>
    <section>
    <h2>Live Text Preview</h2>

    <label for="textInput">Enter your text:</label>
    <input type="text" id="textInput">

    <p id="preview">Your text will appear here</p>

    <p>Characters: <span id="charCount">0</span></p>

    <button id="clearBtn">Clear</button>
</section>

<section>
    <h2>Change an Image</h2>

    <label for="imageSelect">Choose an image:</label>

    <select id="imageSelect">
        <option value="flower">Flower</option>
        <option value="cat">Cat</option>
        <option value="mountain">Mountain</option>
    </select>

    <br>

    <img id="mainImage" src="images/flower.jpg"
         alt="A flower" width="250">

    <p id="imageCaption">A beautiful flower</p>
</section>

<section>
    <h2>Keyboard Events</h2>

    <label for="keyboardInput">Type something:</label>
    <input type="text" id="keyboardInput">

    <p id="keyStatus">Press any key.</p>

    <p>Entered text: <span id="keyResult"></span></p>
</section>

<section>
    <h2>Mouse and Focus Events</h2>

    <p id="cardInstruction">
        Move your mouse over the card or focus on it using Tab.
    </p>

    <div id="myCard" tabindex="0">
        <h3>Interactive Card</h3>
        <p>This is my interactive card.</p>
    </div>
</section>

</body>
</html>
